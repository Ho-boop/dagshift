name: Synthetic demo
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s tests -v
      - run: python -m dagshift.demo --cores 3 --out demo-output
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-demo-${{ matrix.os }}
          path: demo-output/
